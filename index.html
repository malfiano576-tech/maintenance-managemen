<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maintenance Management System - Supabase</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--navy:#142b45;--blue:#2463a6;--bg:#f3f6fa;--line:#dce4ee;--text:#1d2939;--muted:#667085;--green:#16845b;--red:#c0392b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px/1.45 Arial,sans-serif;color:var(--text)}
header{background:linear-gradient(120deg,#10243e,#24527d);color:white;padding:22px 26px;display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}
header h1{font-size:22px;margin:0 0 4px}header p{margin:0;color:#d8e6f5}
.app{display:grid;grid-template-columns:245px 1fr;min-height:calc(100vh - 85px)}
aside{background:#fff;border-right:1px solid var(--line);padding:18px 12px}
.nav-title{font-size:11px;color:#98a2b3;font-weight:bold;padding:8px 12px 5px;text-transform:uppercase}
nav button{width:100%;border:0;background:transparent;text-align:left;padding:11px 12px;border-radius:8px;color:#344054;cursor:pointer;margin:2px 0;font-weight:600}
nav button:hover,nav button.active{background:#eaf2fb;color:#174f86}
main{padding:24px;min-width:0}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h2{margin:0;font-size:22px}.filters,.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input,select,textarea{font:inherit;border:1px solid #cfd8e3;border-radius:7px;padding:9px 10px;background:white;color:var(--text);width:100%}
input[type=file]{padding:7px;font-size:12px}textarea{min-height:76px;resize:vertical}
button.primary,.primary{background:var(--blue);color:#fff;border:0;border-radius:7px;padding:10px 14px;cursor:pointer;font-weight:700}
button.secondary{background:#fff;color:#344054;border:1px solid var(--line);border-radius:7px;padding:9px 12px;cursor:pointer}
button.danger{background:#fff0ee;color:var(--red);border:1px solid #f2c5bf;border-radius:6px;padding:7px 9px;cursor:pointer}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.card,.panel{background:#fff;border:1px solid var(--line);border-radius:11px;padding:16px;box-shadow:0 2px 6px #142b4508}
.card small{color:var(--muted)}.metric{font-size:27px;font-weight:800;margin-top:5px;color:var(--navy)}
.panel{margin-bottom:16px}.panel h3{margin:0 0 13px;font-size:16px}
.table-wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:11px 12px;border-bottom:1px solid #edf0f4;text-align:left;vertical-align:middle}
th{background:#f8fafc;color:#475467;font-size:12px;text-transform:uppercase;white-space:nowrap}
td{font-size:13px}.muted{color:var(--muted)}.empty{text-align:center;padding:35px;color:var(--muted)}
.status{display:inline-block;padding:4px 8px;border-radius:20px;background:#eef2f6;font-size:11px;font-weight:bold}
.status.selesai,.status.closed{background:#e5f6ee;color:#13734e}.status.open,.status.pending,.status.proses{background:#fff4dc;color:#946200}.status.breakdown{background:#ffebe8;color:#b42318}
.thumb{width:52px;height:42px;object-fit:cover;border-radius:5px;border:1px solid var(--line);cursor:pointer}
.modal{position:fixed;inset:0;background:#10182899;display:none;align-items:center;justify-content:center;padding:15px;z-index:10}
.modal.show{display:flex}.dialog{background:#fff;width:min(760px,100%);max-height:92vh;overflow:auto;border-radius:12px;padding:22px}
.dialog-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.dialog-head h3{margin:0}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-weight:700;font-size:12px;color:#475467}
.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.preview{max-width:150px;max-height:110px;object-fit:contain;border:1px solid var(--line);border-radius:7px}
.notice{padding:11px 13px;border-radius:8px;background:#fff8e6;color:#805b00;margin-bottom:15px;font-size:12px}
.hidden{display:none!important}
@media(max-width:900px){.app{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line);padding:8px}nav{display:flex;overflow:auto;gap:4px}nav button{white-space:nowrap;width:auto}.nav-title{display:none}.cards{grid-template-columns:repeat(2,1fr)}main{padding:15px}}
@media(max-width:540px){.cards{grid-template-columns:1fr 1fr}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}header{padding:17px}.metric{font-size:22px}}
</style>
</head>
<body>
<header><div><h1>MAINTENANCE MANAGEMENT SYSTEM</h1><p>Sistem kontrol pekerjaan, perawatan, downtime, dan biaya maintenance</p></div><div style="display:flex;align-items:center;gap:12px"><span id="clock" class="muted" style="color:#e4edf7"></span><button id="logoutBtn" class="secondary hidden" onclick="logout()">Keluar</button></div></header>
<div id="authScreen" style="position:fixed;inset:0;background:#f3f6fa;z-index:30;display:flex;align-items:center;justify-content:center;padding:18px">
 <div class="panel" style="width:min(420px,100%);padding:25px">
  <h2 style="margin-bottom:6px">Login Maintenance</h2>
  <p class="muted" style="margin-top:0">Masuk atau buat akun untuk mengakses data Supabase.</p>
  <div class="field" style="margin:12px 0"><label>Email</label><input id="authEmail" type="email" autocomplete="username" placeholder="email@perusahaan.com"></div>
  <div class="field" style="margin:12px 0"><label>Password</label><input id="authPassword" type="password" autocomplete="current-password" placeholder="Minimal 6 karakter"></div>
  <div class="actions"><button class="primary" style="flex:1" onclick="signIn()">Masuk</button><button class="secondary" style="flex:1" onclick="signUp()">Buat Akun</button></div>
  <p id="authMessage" class="muted" style="margin-bottom:0;font-size:12px"></p>
 </div>
</div>
<div class="app">
<aside>
<div class="nav-title">Menu Utama</div>
<nav id="nav"></nav>
</aside>
<main>
<div class="toolbar">
<div><h2 id="pageTitle">Dashboard</h2><div class="muted" id="pageSub">Ringkasan aktivitas maintenance</div></div>
<div class="filters">
<select id="period"><option value="month">Bulanan</option><option value="year">Tahunan</option><option value="all">Semua Periode</option></select>
<select id="month"></select><select id="year"></select>
</div></div>
<div id="content"></div>
</main></div>
<div class="modal" id="modal"><div class="dialog">
<div class="dialog-head"><h3 id="modalTitle">Tambah Data</h3><button class="secondary" onclick="closeModal()">Tutup ✕</button></div>
<form id="recordForm"><div class="form-grid" id="formFields"></div><div class="form-actions"><button type="button" class="secondary" onclick="closeModal()">Batal</button><button class="primary" type="submit">Simpan Data</button></div></form>
</div></div>
<script>
const SUPABASE_URL = 'https://iphiolhqpaxhiwwigxyl.supabase.co';
const SUPABASE_KEY = 'sb_publishable_bNjEu-tOspwFelkM2CFo7A_Ds9349Kg';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const BUCKET = 'maintenance-foto';

const modules=[
{id:'wo',name:'Work Order',desc:'Permintaan dan pelaksanaan pekerjaan',fields:[['Nomor WO','text'],['Tanggal','date'],['Mesin / Area','text'],['Pelapor','text'],['Keluhan / Pekerjaan','textarea'],['Prioritas','select','Rendah|Sedang|Tinggi|Darurat'],['PIC Teknisi','text'],['Status','select','Open|Pending|Proses|Selesai'],['Tanggal Selesai','date'],['Catatan','textarea']]},
{id:'pm',name:'Preventive Maintenance',desc:'Jadwal dan realisasi perawatan berkala',fields:[['Tanggal','date'],['Mesin / Area','text'],['Jenis Perawatan','text'],['Aktivitas Checklist','textarea'],['PIC','text'],['Status','select','Terjadwal|Proses|Selesai|Pending'],['Tanggal Realisasi','date'],['Catatan','textarea']]},
{id:'pending',name:'Pekerjaan Tertunda',desc:'Kontrol pekerjaan yang belum selesai',fields:[['Tanggal','date'],['Nomor WO','text'],['Mesin / Area','text'],['Pekerjaan Tertunda','textarea'],['Alasan Tertunda','textarea'],['PIC','text'],['Target Selesai','date'],['Status','select','Pending|Proses|Selesai']]},
{id:'breakdown',name:'Breakdown & Downtime',desc:'Pencatatan kerusakan dan waktu berhenti',fields:[['Tanggal Mulai','date'],['Mesin / Area','text'],['Gejala Kerusakan','textarea'],['Jam Mulai','time'],['Tanggal Selesai','date'],['Jam Selesai','time'],['Durasi Downtime (jam)','number'],['Tindakan Perbaikan','textarea'],['Status','select','Open|Proses|Selesai']]},
{id:'rca',name:'Root Cause Analysis',desc:'Analisa akar penyebab masalah',fields:[['Tanggal','date'],['Mesin / Area','text'],['Masalah','textarea'],['Penyebab Langsung','textarea'],['Akar Penyebab','textarea'],['Tindakan Koreksi','textarea'],['Tindakan Pencegahan','textarea'],['PIC','text'],['Status','select','Open|Proses|Selesai']]},
{id:'spare',name:'Sparepart Kritis',desc:'Kontrol persediaan dan kebutuhan sparepart',fields:[['Nama Sparepart','text'],['Kode Part','text'],['Mesin / Area','text'],['Stok Saat Ini','number'],['Minimum Stok','number'],['Satuan','text'],['Lokasi Penyimpanan','text'],['Supplier','text'],['Catatan','textarea']]},
{id:'predictive',name:'Predictive Maintenance',desc:'Monitoring kondisi dan indikasi kerusakan',fields:[['Tanggal','date'],['Mesin / Area','text'],['Parameter','text'],['Hasil Pengukuran','text'],['Kondisi','select','Normal|Warning|Critical'],['Rekomendasi','textarea'],['PIC','text']]},
{id:'shutdown',name:'Shutdown & Startup',desc:'Rencana shutdown dan kesiapan startup',fields:[['Tanggal','date'],['Area / Mesin','text'],['Jenis Aktivitas','select','Shutdown|Startup'],['Rencana Pekerjaan','textarea'],['PIC','text'],['Kesiapan / Temuan','textarea'],['Status','select','Rencana|Proses|Selesai']]},
{id:'cost',name:'Biaya Maintenance',desc:'Kontrol biaya material dan jasa',fields:[['Tanggal','date'],['Nomor WO','text'],['Mesin / Area','text'],['Jenis Biaya','select','Sparepart|Jasa|Tenaga Kerja|Lainnya'],['Deskripsi','textarea'],['Jumlah Biaya (Rp)','number'],['Vendor','text'],['Approval','text']]},
{id:'machine',name:'Master Data Mesin',desc:'Daftar mesin dan aset yang dapat ditambah kapan saja',fields:[['Nama Mesin','text'],['Kode Mesin','text'],['Area','text'],['Merek / Tipe','text'],['Nomor Seri','text'],['Tanggal Instalasi','date'],['Kapasitas','text'],['Status Mesin','select','Aktif|Standby|Tidak Aktif'],['Catatan','textarea']]},
{id:'misc',name:'Catatan Maintenance',desc:'Dokumentasi dan catatan tambahan',fields:[['Tanggal','date'],['Judul','text'],['Kategori','text'],['Uraian','textarea'],['PIC','text'],['Status','select','Open|Proses|Selesai']]}
];

let current='dashboard', editing=null, photoData='', photoPath='', currentUser=null;
let records={};
const $=id=>document.getElementById(id);
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dateValue(r){return r['Tanggal']||r['Tanggal Mulai']||r['Tanggal Selesai']||r['Tanggal Instalasi']||r['Target Selesai']||''}
function list(id){return records[id]||[]}
function selectedRows(id){return list(id).filter(r=>{let d=dateValue(r);if(!d)return true;let dt=new Date(d+'T00:00:00');if(isNaN(dt))return true;let p=$('period').value;return p==='all'||(p==='year'&&dt.getFullYear()===+$('year').value)||(p==='month'&&dt.getFullYear()===+$('year').value&&dt.getMonth()===+$('month').value)})}
function initFilters(){let now=new Date();$('month').innerHTML=Array.from({length:12},(_,i)=>`<option value="${i}">${new Date(2020,i).toLocaleString('id-ID',{month:'long'})}</option>`).join('');$('year').innerHTML=Array.from({length:12},(_,i)=>`<option>${now.getFullYear()-5+i}</option>`).join('');$('month').value=now.getMonth();$('year').value=now.getFullYear();$('period').onchange=()=>{$('month').classList.toggle('hidden',$('period').value!=='month');render()};$('month').onchange=$('year').onchange=render;$('period').dispatchEvent(new Event('change'))}
function renderNav(){ $('nav').innerHTML=`<button data-id="dashboard" class="${current==='dashboard'?'active':''}">▦ Dashboard</button><div class="nav-title">Data Maintenance</div>`+modules.map(m=>`<button data-id="${m.id}" class="${current===m.id?'active':''}">${m.name}</button>`).join('');$('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{current=b.dataset.id;render()})}
function render(){renderNav();let m=modules.find(x=>x.id===current);$('pageTitle').textContent=m?m.name:'Dashboard';$('pageSub').textContent=m?m.desc:'Ringkasan aktivitas maintenance berdasarkan periode';if(!m){renderDashboard();return}renderModule(m)}
function renderDashboard(){let all=modules.flatMap(m=>selectedRows(m.id).map(r=>({...r,_module:m.name})));let wo=selectedRows('wo');let open=wo.filter(r=>!['Selesai','Closed'].includes(r.Status)).length;let pending=selectedRows('pending').filter(r=>r.Status!=='Selesai').length;let bd=selectedRows('breakdown').length;let cost=selectedRows('cost').reduce((s,r)=>s+(+r['Jumlah Biaya (Rp)']||0),0);$('content').innerHTML=`<div class="cards"><div class="card"><small>Total Work Order</small><div class="metric">${wo.length}</div></div><div class="card"><small>WO Belum Selesai</small><div class="metric">${open}</div></div><div class="card"><small>Pekerjaan Pending</small><div class="metric">${pending}</div></div><div class="card"><small>Catatan Breakdown</small><div class="metric">${bd}</div></div></div><div class="cards"><div class="card"><small>Total Mesin Terdaftar</small><div class="metric">${list('machine').length}</div></div><div class="card"><small>PM Tercatat</small><div class="metric">${selectedRows('pm').length}</div></div><div class="card"><small>Sparepart Terdaftar</small><div class="metric">${list('spare').length}</div></div><div class="card"><small>Total Biaya</small><div class="metric" style="font-size:20px">Rp ${cost.toLocaleString('id-ID')}</div></div></div><div class="panel"><h3>Aktivitas Terbaru</h3><div class="table-wrap"><table><thead><tr><th>Menu</th><th>Tanggal</th><th>Nama / Mesin</th><th>Status</th></tr></thead><tbody>${all.slice(-10).reverse().map(r=>`<tr><td>${esc(r._module)}</td><td>${esc(dateValue(r)||'-')}</td><td>${esc(r['Mesin / Area']||r['Nama Mesin']||r['Judul']||r['Nomor WO']||'-')}</td><td>${esc(r.Status||'-')}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">Belum ada data pada periode ini.</td></tr>'}</tbody></table></div></div><div class="notice">Terhubung ke Supabase. Data dan foto disimpan online setelah login.</div>`}
function rowHTML(m,r){return `<tr>${m.fields.map(f=>`<td>${esc(r[f[0]]||'-')}</td>`).join('')}<td>${r.photo?`<img class="thumb" src="${r.photo}" onclick="viewPhoto('${r.id}')" title="Lihat foto">`:'-'}</td><td><div class="actions"><button class="secondary" onclick="openForm('${m.id}','${r.id}')">Edit</button><button class="danger" onclick="removeRecord('${m.id}','${r.id}')">Hapus</button></div></td></tr>`}
function renderModule(m){let rows=selectedRows(m.id);$('content').innerHTML=`<div class="toolbar"><div class="muted">${rows.length} data pada periode terpilih</div><div class="actions"><input id="search" placeholder="Cari data..." style="width:190px"><button class="secondary" onclick="exportCSV('${m.id}')">Ekspor CSV</button><button class="primary" onclick="openForm('${m.id}')">＋ Tambah Data</button></div></div><div class="table-wrap"><table><thead><tr>${m.fields.map(f=>`<th>${esc(f[0])}</th>`).join('')}<th>Foto</th><th>Aksi</th></tr></thead><tbody id="tbody">${rows.length?rows.map(r=>rowHTML(m,r)).join(''):`<tr><td colspan="${m.fields.length+2}" class="empty">Belum ada data. Klik Tambah Data untuk mulai.</td></tr>`}</tbody></table></div><div class="notice" style="margin-top:13px">Foto dokumentasi disimpan di Supabase Storage dan dapat diakses setelah login.</div>`;$('search').oninput=()=>{let q=$('search').value.toLowerCase();$('tbody').innerHTML=rows.filter(r=>JSON.stringify(r).toLowerCase().includes(q)).map(r=>rowHTML(m,r)).join('')||`<tr><td colspan="${m.fields.length+2}" class="empty">Data tidak ditemukan.</td></tr>`}}
function openForm(id,idEdit=null){current=id;editing=idEdit;photoData='';photoPath='';let m=modules.find(x=>x.id===id),r=idEdit?list(id).find(x=>x.id===idEdit):{};$('modalTitle').textContent=(idEdit?'Edit ':'Tambah ')+m.name;$('formFields').innerHTML=m.fields.map(f=>{let name=f[0],type=f[1],value=r[name]||'';let control=type==='textarea'?`<textarea name="${esc(name)}">${esc(value)}</textarea>`:type==='select'?`<select name="${esc(name)}">${f[2].split('|').map(v=>`<option ${value===v?'selected':''}>${v}</option>`).join('')}</select>`:`<input name="${esc(name)}" type="${type}" value="${esc(value)}">`;return `<div class="field ${type==='textarea'?'full':''}"><label>${esc(name)}</label>${control}</div>`}).join('')+`<div class="field full"><label>Foto / Dokumentasi</label><input type="file" id="photoInput" accept="image/*" capture="environment"><small class="muted">Foto akan diunggah ke Supabase Storage. Foto lama tetap digunakan jika tidak memilih foto baru.</small><img id="photoPreview" class="preview ${r.photo?'':'hidden'}" src="${r.photo||''}"></div>`;photoData=r.photo||'';photoPath=r.photo_path||'';$('photoInput').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{photoData=await compressImage(file);$('photoPreview').src=photoData;$('photoPreview').classList.remove('hidden')}catch(err){alert('Foto gagal diproses: '+err.message)}};$('modal').classList.add('show')}
function compressImage(file){return new Promise((resolve,reject)=>{let img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{let max=1280,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);resolve(c.toDataURL('image/jpeg',.72))};img.onerror=reject;img.src=url})}
async function uploadPhoto(dataUrl,moduleId,recordId){let blob=await (await fetch(dataUrl)).blob();let path=`${currentUser.id}/${moduleId}/${recordId}_${Date.now()}.jpg`;let {error}=await supabase.storage.from(BUCKET).upload(path,blob,{contentType:'image/jpeg',upsert:false});if(error)throw error;return path}
async function signedPhoto(path){if(!path)return '';let {data,error}=await supabase.storage.from(BUCKET).createSignedUrl(path,3600);if(error){console.warn(error);return ''}return data.signedUrl}
async function refreshPhotoUrls(){for(const m of modules){for(const r of list(m.id)){if(r.photo_path)r.photo=await signedPhoto(r.photo_path)}}}
$('recordForm').onsubmit=async e=>{e.preventDefault();let m=modules.find(x=>x.id===current),data=Object.fromEntries(new FormData($('recordForm')).entries()),rows=list(current),old=editing?rows.find(x=>x.id===editing):null,id=editing||crypto.randomUUID();let path=old?.photo_path||null;let newPath=null;try{$('recordForm').querySelector('button[type=submit]').disabled=true;$('recordForm').querySelector('button[type=submit]').textContent='Menyimpan...';if(photoData&&photoData.startsWith('data:')){newPath=await uploadPhoto(photoData,current,id);path=newPath}let recordDate=dateValue(data)||null;let payload={module_key:current,record_date:recordDate,data,photo_path:path,updated_at:new Date().toISOString()};let result;if(editing){result=await supabase.from('maintenance_records').update(payload).eq('id',id).select().single()}else{payload.id=id;payload.created_by=currentUser.id;result=await supabase.from('maintenance_records').insert(payload).select().single()}if(result.error)throw result.error;if(old){Object.assign(old,data,{id,photo_path:path,photo: newPath?await signedPhoto(newPath):(old.photo||'' )})}else rows.push({...data,id,photo_path:path,photo:path?await signedPhoto(path):''});records[current]=rows;if(newPath&&old?.photo_path){await supabase.storage.from(BUCKET).remove([old.photo_path])}closeModal();render()}catch(err){if(newPath)await supabase.storage.from(BUCKET).remove([newPath]);alert('Gagal menyimpan ke Supabase: '+(err.message||err));}finally{let b=$('recordForm').querySelector('button[type=submit]');b.disabled=false;b.textContent='Simpan Data'}};
function closeModal(){$('modal').classList.remove('show');editing=null}
async function removeRecord(moduleId,rid){if(!confirm('Hapus data ini dari Supabase?'))return;let row=list(moduleId).find(r=>r.id===rid);let {error}=await supabase.from('maintenance_records').delete().eq('id',rid);if(error){alert('Gagal menghapus: '+error.message);return}if(row?.photo_path)await supabase.storage.from(BUCKET).remove([row.photo_path]);records[moduleId]=list(moduleId).filter(r=>r.id!==rid);render()}
function viewPhoto(id){let r=modules.flatMap(m=>list(m.id)).find(x=>x.id===id);if(r?.photo)window.open(r.photo,'_blank','noopener')}
function exportCSV(id){let m=modules.find(x=>x.id===id),rows=selectedRows(id),cols=m.fields.map(f=>f[0]);let csv=[[...cols,'Foto tersedia'],...rows.map(r=>cols.map(c=>r[c]||'').concat(r.photo_path?'Ya':'Tidak'))].map(a=>a.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');let blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=m.id+'_maintenance.csv';a.click();URL.revokeObjectURL(a.href)}
async function loadCloudData(){let {data,error}=await supabase.from('maintenance_records').select('*').order('created_at',{ascending:true});if(error)throw error;records={};for(const row of data){if(!records[row.module_key])records[row.module_key]=[];records[row.module_key].push({id:row.id,...(row.data||{}),photo_path:row.photo_path||'',photo:''})}await refreshPhotoUrls();render()}
async function signIn(){let email=$('authEmail').value.trim(),password=$('authPassword').value;if(!email||!password){$('authMessage').textContent='Isi email dan password terlebih dahulu.';return}$('authMessage').textContent='Sedang masuk...';let {error}=await supabase.auth.signInWithPassword({email,password});if(error){$('authMessage').textContent=error.message;return}await afterLogin()}
async function signUp(){let email=$('authEmail').value.trim(),password=$('authPassword').value;if(!email||password.length<6){$('authMessage').textContent='Isi email dan password minimal 6 karakter.';return}$('authMessage').textContent='Membuat akun...';let {data,error}=await supabase.auth.signUp({email,password});if(error){$('authMessage').textContent=error.message;return}if(!data.session){$('authMessage').textContent='Akun dibuat. Periksa email untuk konfirmasi, lalu kembali dan tekan Masuk.';return}await afterLogin()}
async function afterLogin(){let {data:{user},error}=await supabase.auth.getUser();if(error||!user){$('authMessage').textContent=error?.message||'Tidak dapat membaca akun.';return}currentUser=user;$('authScreen').classList.add('hidden');$('logoutBtn').classList.remove('hidden');try{await loadCloudData()}catch(err){alert('Login berhasil, tetapi data gagal dimuat: '+err.message)}}
async function logout(){await supabase.auth.signOut();currentUser=null;records={};$('logoutBtn').classList.add('hidden');$('authScreen').classList.remove('hidden')}
async function boot(){initFilters();let {data:{session}}=await supabase.auth.getSession();if(session){await afterLogin()}else{$('authScreen').classList.remove('hidden')}supabase.auth.onAuthStateChange(async(event,session)=>{if(event==='SIGNED_OUT'){$('authScreen').classList.remove('hidden');$('logoutBtn').classList.add('hidden')}})}
boot();setInterval(()=>$('clock').textContent=new Date().toLocaleString('id-ID'),1000);
</script>
</body></html>
